# Firebase App Hosting configuration for Eshwar Route
# Documentation: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 2
  memoryMiB: 2048

env:
  - variable: NODE_ENV
    value: production
  - variable: OMNIROUTE_MEMORY_MB
    value: "1024"
